spring:
  application:
    name: workflow-service

  datasource:
    url: jdbc:postgresql://localhost:5433/workflow_db
    username: workflow_user
    password: workflow_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration


server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: Workflow Service
    version: 1.0.0-SNAPSHOT


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true